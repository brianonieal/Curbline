; Scoped deliberately. This is not a "type the codebase" project and turning
; mypy on fully would report 46 findings, most of them inference artifacts from
; psycopg's row_factory, which is noise rather than signal under a deadline.
;
; What it IS here for: catching calls to attributes that do not exist on a typed
; library object, without executing anything. That is the class that produced
; E-013 (a PostgreSQL function signature psycopg could not resolve), that E-017
; sat next to, and that produced a `tx.rollback` in the first draft of
; scripts/preflight.py. psycopg, redis and boto3 all ship type information, so
; the checker can see what the interpreter would only find at runtime, and
; runtime here means during a billable capture window.
;
; Every other error code is disabled ON PURPOSE. Re-enable one only if you are
; prepared to fix everything it reports; a gate that is routinely overridden
; teaches people to override gates.

; check_untyped_defs is the setting that makes this work at all, and it was not
; obvious. Without it mypy skips the BODY of any function with no annotations,
; and scripts/preflight.py is written as bare `def _():` closures, so the whole
; file passed trivially. The first version of this gate reported success on a
; file containing the exact bug it was built to catch. Verified by putting the
; bug back and watching it fail, which is the only way to know a gate works.

[mypy]
ignore_missing_imports = True
check_untyped_defs = True
disable_error_code =
    call-overload,
    return-value,
    var-annotated,
    arg-type,
    index,
    union-attr

; Vendored code and the virtualenv are not ours to fix.
exclude = (^\.venv/|^data/)
